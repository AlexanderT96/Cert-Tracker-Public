name: Repair renderer truncation artifact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-renderer.yml'

permissions:
  contents: write

concurrency:
  group: repair-renderer-main
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore intended renderer and remove truncation artifact
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git show 1e95db01fffa9feb269669fa61e87a0d8db0bf58:src/renderer.js | tail -n +4 > src/renderer.js
          if grep -q '^Warning: truncated output' src/renderer.js; then
            echo 'Truncation artifact still present' >&2
            exit 1
          fi
          node --check src/renderer.js
      - name: Commit repaired renderer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/renderer.js
          if git diff --cached --quiet; then
            echo 'No renderer repair required.'
            exit 0
          fi
          git commit -m 'Repair renderer truncation artifact'
          git pull --rebase origin main
          git push origin HEAD:main
